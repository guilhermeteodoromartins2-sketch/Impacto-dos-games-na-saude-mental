    <main class="espacoTopo">

        <h2 class="contatoh2">Contact - us</h2>

        <form>
            <!--nome-->
            <label for="nome">Name:</label>
            <input type="text" id="nome" name="nome" required minlength="3" maxlength="60"
                placeholder="Enter your name. (Required*)" pattern="[a-zA-ZÀ-ÿ\s]+">
            <!--email-->
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required minlength="5" maxlength="50"
                placeholder="Enter your email. (Required*)" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
                title="Digite seu email.">

            <!--telefone-->
            <label for="tel">phone</label>
            <input type="text" id="tel" name="tel" required="required" pattern="[0-9()+\-\s]+" title="(+DDD-99999-8888)"
                maxlength="16" placeholder="Enter your Phone (Required*)">

            <!--Avaliação-->
            <label for="categoria">Avaliação:</label>
            <select id="categoria" name="categoria" required>
                <option value="" disabled selected hidden>Rate us (Required*)</option>
                <option value="0">0 Stars</option>
                <option value="1">1 Stars</option>
                <option value="2">2 Stars</option>
                <option value="3">3 Stars</option>
                <option value="4">4 Stars</option>
                <option value="5">5 Stars</option>
            </select>

            <label for="comentario">Comentary:</label>
            <textarea id="comentario" rows="6" cols="40" placeholder="Leave your comment"></textarea>

            <button type="submit">Send</button>
            <button type="reset">Clear</button>

        </form>
