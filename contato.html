    <main class="espacoTopo">

        <h2 class="contatoh2">Contate-nos</h2>

        <form>
            <!--nome-->
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required minlength="3" maxlength="60"
                placeholder="Digite seu nome. (Obrigatório*)" pattern="[a-zA-ZÀ-ÿ\s]+">
            <!--email-->
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required minlength="5" maxlength="50"
                placeholder="Digite seu email. (Obrigatório*)" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
                title="Digite seu email.">

            <!--telefone-->
            <label for="tel">Tel</label>
            <input type="text" id="tel" name="tel" required="required" pattern="[0-9()+\-\s]+" title="(+DDD-99999-8888)"
                maxlength="16" placeholder="Digite o seu telefone. (Obrigatório*)">

            <!--Avaliação-->
            <label for="categoria">Avaliação:</label>
            <select id="categoria" name="categoria" required>
                <option value="" disabled selected hidden>Nos avalie (Obrigatório*)</option>
                <option value="0">0 Estrela</option>
                <option value="1">1 Estrela</option>
                <option value="2">2 Estrelas</option>
                <option value="3">3 Estrelas</option>
                <option value="4">4 Estrelas</option>
                <option value="5">5 Estrelas</option>
            </select>

            <label for="comentario">Comentário:</label>
            <textarea id="comentario" rows="6" cols="40" placeholder="Deixe seu comentário"></textarea>

            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>

        </form>
